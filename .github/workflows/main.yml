name: Secure DevSecOps Pipeline 

on: 
  push: 
    branches: 
      - master 
  workflow_dispatch:  

jobs: 
  build: 
    runs-on: ubuntu-slim 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Cache Dependencies 
        uses: actions/cache@v4 
        with:
          path: ~/.npm 
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }} 

      - name: Build 
        run: npm install 

  test: 
    needs: build
    runs-on: ubuntu-slim 
    steps: 

      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Cache Dependencies 
        uses: actions/cache@v4 
        with: 
          path: ~/.npm 
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }} 

      - name: Test 
        run: echo "code is tested" 

  deploy:
    needs: test
    runs-on: ubuntu-slim 
    steps: 
      - name: Deploy 
        run: echo "code is deploy" 
