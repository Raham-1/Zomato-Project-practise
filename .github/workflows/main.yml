name: Secure DevSecOps Pipeline 


on: 
  push: 
    branches: 
      - master 
      - main 
  workflow_dispatch:  

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write
  
  
jobs: 
  build: 
    runs-on: ubuntu-slim 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Cache Dependencies 
        uses: actions/cache@v4 
        with: 
          path: ~/.npm 
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }} 

      - name: Build 
        run: npm install 

  test:
     runs-on: ubuntu-slim
     needs: build
     steps:
      - name: Test 
        run: echo "code is tested

        
  security:
    runs-on: ubuntu-slim
    needs: test
    steps:
      - name: secure 
        run: echo "security checks performed" 
